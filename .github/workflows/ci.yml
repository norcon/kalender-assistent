name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t kalender-assistent:test .
      - name: Tests im Image
        run: |
          docker run --rm --network none -u 0 -v "$PWD/tests:/app/tests:ro" -v "$PWD/updater:/app/updater:ro" \
            -e IMAP_HOST=x -e IMAP_USERNAME=x -e IMAP_PASSWORD=x \
            -e APP_DATABASE_PATH=/tmp/test.sqlite3 \
            kalender-assistent:test python -m unittest discover -s tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nach Zugangsdaten suchen (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --exit-code 1
