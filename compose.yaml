services:
  kalender-assistent:
    # Fertiges Image von GitHub; mit KALENDER_VERSION=0.16.0 in .env auf eine Version festlegen.
    image: ghcr.io/norcon/kalender-assistent:${KALENDER_VERSION:-latest}
    # Zum selbst Bauen (Entwicklung): docker compose build
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_DATABASE_PATH: /data/calendar-assistant.sqlite3
      APP_BACKUP_DIR: /backups
    ports:
      - "${KALENDER_PORT:-8080}:8000"
    volumes:
      - ./data:/data
      - ./backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Update auf Knopfdruck (Einstellungen → Sicherungen → Version).
  # Einschalten mit:  docker compose --profile updater up -d
  # Hat Zugriff auf Docker – siehe SECURITY.md.
  updater:
    profiles: ["updater"]
    image: ghcr.io/norcon/kalender-assistent-updater:${KALENDER_UPDATER_VERSION:-latest}
    build: ./updater
    restart: unless-stopped
    working_dir: ${PWD}
    environment:
      PWD: ${PWD}
      PROJECT_DIR: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}
    security_opt:
      - no-new-privileges:true
